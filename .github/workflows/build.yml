name: Build Hotyn Helper

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject API key
        shell: pwsh
        run: |
          $key = "${{ secrets.OPENROUTER_KEY }}"
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Host "::warning::OPENROUTER_KEY не задан. Программа соберётся без ключа."
            $key = "NO_KEY_CONFIGURED"
          }
          $path = "MainForm.cs"
          if (Test-Path $path) {
            (Get-Content $path) -replace 'OPENROUTER_KEY_PLACEHOLDER', $key | Set-Content $path
            Write-Host "Ключ подставлен в $path"
          } else {
            Write-Host "::error::Файл MainForm.cs не найден в корне репозитория!"
            exit 1
          }

      - name: Restore
        run: dotnet restore HotynHelper.csproj

      - name: Publish
        run: >
          dotnet publish HotynHelper.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: HotynHelper-portable
          path: publish/HotynHelper.exe
          if-no-files-found: error
